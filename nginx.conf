server {
    listen 80;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Headers de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=()" always;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; upgrade-insecure-requests" always;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # HTML: sempre verificar atualizações
    location = /index.html {
        expires -1;
    }

    # Configuração de runtime: não armazenar em cache
    location = /config.js {
        try_files $uri =404;
        expires -1;
        access_log off;
    }

    # Assets gerados pelo Vite
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # Arquivos públicos
    location ~* \.(?:png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Rotas da SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
